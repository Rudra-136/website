<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

  <!-- HEADER -->
  <header class="bg-white px-10 py-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">

      <!-- Left Branding -->
      <div class="flex items-center gap-4">
        <img src="logo.png" class="w-16 h-16" alt="Logo">
        <div>
          <h1 class="text-3xl tracking-widest font-light">ENLIR AVANT</h1>
          <h2 class="text-3xl tracking-widest font-light">SYSTÈME</h2>
        </div>
      </div>

      <!-- Right Product Name -->
      <div class="text-right">
        <h2 class="text-5xl font-medium">SeaWarden</h2>
        <p class="text-xl text-gray-700">Autonomy in the blue</p>
      </div>

    </div>
  </header>

  <!-- NAV STRIP -->
  <nav class="bg-[#0B2B4A] text-white py-3">
    <div class="max-w-7xl mx-auto flex justify-center gap-8 text-lg tracking-wide">
      <span>Defense</span>
      <span>|</span>
      <span>Aviation</span>
      <span>|</span>
      <span>Energy Systems</span>
      <span>|</span>
      <span>Simulations</span>
      <span>|</span>
      <span>Semantic Systems</span>
    </div>
  </nav>

  <!-- HERO -->
  <section class="relative h-[700px]">
    <img src="hero-bg.jpg" class="absolute inset-0 w-full h-full object-cover">

    <div class="absolute inset-0 bg-black/30"></div>

    <div class="relative max-w-7xl mx-auto h-full flex items-center px-10">
      <div class="bg-black/50 backdrop-blur-sm p-8 max-w-2xl text-white rounded-xl">
        <h2 class="text-4xl font-semibold mb-4">
          Autonomous Intelligence Systems
        </h2>

        <p class="text-lg leading-relaxed text-gray-200">
          Building next-generation autonomous, intelligence, and simulation systems
          across defense, aviation, and industrial domains.
        </p>
      </div>
    </div>
  </section>

</body>
</html>
